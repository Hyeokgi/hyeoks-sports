name: Fetch Market Odds

on:
  schedule:
    - cron: "0 */2 * * *" # 배당은 자주 움직이므로 2시간마다 갱신
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run market odds fetcher
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/fetch_market_odds.mjs

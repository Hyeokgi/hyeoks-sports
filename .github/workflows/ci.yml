name: CI

# PR·main 푸시마다 AGENTS.md의 커밋 전 검사(typecheck · test · build:client)를 러너에서 돌린다.
# 로컬 도구 없이(웹 편집 등) 올린 변경도 병합 전에 같은 기준으로 확인하기 위해서다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:client

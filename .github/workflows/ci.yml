name: CI

# PR·main 푸시마다 AGENTS.md의 커밋 전 검사(typecheck · test · build:client)를 러너에서 돌린다.
# 로컬 도구 없이(웹 편집 등) 올린 변경도 병합 전에 같은 기준으로 확인하기 위해서다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 새 이력은 추가 전용이다. 문자열 검사뿐 아니라 실제 SQLite에서 시각 가드와 중복 억제를 검증한다.
      - name: Test immutable prediction history SQL
        run: |
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sqlite3
          fi
          node scripts/test_prediction_history_sql.mjs
      - run: npm run build:client

name: Fetch Betman Vote Share

on:
  schedule:
    - cron: "0 */4 * * *" # 투표 쏠림 변화 추적용, 4시간마다
  workflow_dispatch:
    inputs:
      task:
        description: "pipeline: 회차감지+배당+투표율+독식픽 / backfill: EPL·세리에A 백필 생성+커밋 / offline-pick: 발매중 회차 오프라인 독식픽(배포 불필요) / deploy: D1 백필 적용+Worker 배포+동기화 / sheets: 구글시트(회차분석+팀DB+선수DB) 갱신 / logos: 팀 엠블럼 수집+커밋 / compare-market: 종가배당 vs 모델 / compare-market-d1: 앱 실제 배당 vs 모델 / compare-bookmakers: 북메이커별·시점별 배당 품질 / round-report: 정산 회차 사후분석 / diagnose-round: 회차 감지 실패 원인 진단 / probe-round: 회차 대진·배당·매핑 조사 / probe-results: 종료 회차 스코어 노출 여부 조사 / measure-baseball: 야구토토 승1패 예측 가능성 실측 / probe-baseball-odds: 야구토토 해외배당 제공 여부 조사 / measure-xg-europe: 유럽 4대리그 xG 예측력 워크포워드 검증 / probe-xg-sources: 경기별 xG 데이터 소스 조사 / ablation: A~F 절제 사다리(무엇이 실제 예측력을 더하는가) / measure-xg-variants: xG 5개 형태 비교"
        type: choice
        default: pipeline
        options:
          - pipeline
          - backfill
          - offline-pick
          - deploy
          - logos
          - compare-market
          - compare-market-d1
          - compare-bookmakers
          - diagnose-round
          - probe-round
          - probe-results
          - measure-baseball
          - probe-baseball-odds
          - measure-xg-europe
          - probe-xg-sources
          - ablation
          - measure-xg-variants
          - round-report
          - sheets
      round_no:
        description: "회차 번호. round-report: 분석할 회차(비우면 최근 정산 회차) / probe-round: 조사할 회차(비우면 47) / probe-results: 조사할 종료 회차(비우면 46)"
        required: false
        type: string
      force_draws:
        description: "무승부 강제 슬롯: 숫자(0~5) 또는 auto(최근 2개 완료 시즌 무승부율 앵커). offline-pick 전용"
        type: string
        default: ""

jobs:
  fetch:
    # 스케줄 실행은 기존 투표율 수집 그대로, 수동(pipeline)은 회차감지->배당->투표율->독식픽 전체.
    # (generate_round.yml은 main에 머지되기 전까지 workflow_dispatch 등록이 안 되므로,
    # main에 이미 등록된 이 워크플로우 경로에 dispatch 전용 단계로 얹는다.)
    if: github.event_name == 'schedule' || inputs.task == 'pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Detect/register new round (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/detect_round.mjs
      - name: Fetch market odds (manual run only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true # 배당이 아직 없어도 이후 단계는 진행
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/fetch_market_odds.mjs
      - name: Install Playwright
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: Run vote share fetcher
        continue-on-error: true # 발매 전이면 투표율이 없을 수 있음 - 독식픽 출력은 계속 진행
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/fetch_vote_share.mjs
      - name: Print exclusive pick (manual run only)
        if: github.event_name == 'workflow_dispatch'
        run: npx tsx scripts/print_exclusive_pick.ts

  # EPL/세리에A 과거경기 백필 데이터를 생성해 브랜치에 커밋한다 (수동 전용).
  backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'backfill'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate backfill data
        run: npx tsx scripts/backfill_leagues.ts
      - name: Commit backfill data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed/backfill_leagues.sql seed/backfill_leagues.json seed/fotmob_current_names.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "EPL/세리에A 과거경기 백필 데이터 생성 (football-data.co.uk, FotMob 현재시즌 팀명 교차검증)"
          git push

  # D1 백필 적용 -> Worker 배포 -> 결과 동기화(admin sync)까지. 이후 task=pipeline으로 회차 등록.
  # 필요 시크릿: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + D1:Edit 권한), ADMIN_TOKEN.
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      # 스키마 마이그레이션을 먼저 적용한다. 예전엔 이 단계가 없어 새 컬럼을 추가하면 사람이
      # 수동으로 db:migrate:remote를 돌려야 했고, 안 돌리면 배포된 워커가 없는 컬럼에 INSERT하다
      # 터진다. wrangler가 적용 이력을 관리하므로 매번 돌려도 안전하다.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply kleague-toto-db --remote
      - name: Apply D1 backfill (EPL/세리에A)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute kleague-toto-db --remote --file=seed/backfill_leagues.sql
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Sync history (Elo/무승부율 재계산 트리거)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # --max-time 없이 두면 Worker가 응답을 안 줄 때 러너가 6시간 한도까지 매달린다(실제 발생).
          curl -sf --max-time 300 -X POST -H "Authorization: Bearer $ADMIN_TOKEN" \
            "${WORKER_BASE_URL:-https://kleague-toto-predictor.hyeoks.workers.dev}/api/admin/sync"

  # 발매중 회차(예: 46회차)를 Worker 배포/D1 백필 없이 러너에서 직접 분석해 독식픽을 출력한다.
  offline-pick:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'offline-pick'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: Offline round pick
        env:
          FORCE_DRAWS: ${{ inputs.force_draws }}
        run: npx tsx scripts/offline_round_pick.ts

  # 구글시트 갱신(회차분석 + 팀 DB/선수 DB). export_sheets.yml이 main에 등록되기 전까지
  # 이 경로로도 수동 실행할 수 있게 둔다 - 머지 후에는 export_sheets.yml 쪽을 쓰면 된다.
  # 팀 엠블럼 수집(FotMob) 후 public/logos/에 자체 호스팅하고 커밋한다.
  # 샌드박스에서는 fotmob.com이 막혀 있어 러너에서만 돌릴 수 있다.
  logos:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'logos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Fetch team logos
        run: npx tsx scripts/fetch_team_logos.ts
      - name: Commit logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/logos src/lib/teamLogos.ts seed/logo_unmatched.json || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "팀 엠블럼 수집 갱신 (자동)"
            git push
          fi

  # 북메이커 종가배당 vs 우리 모델 정면 비교. football-data.co.uk CSV에 배당이 같이 들어
  # 있어 백테스트와 동일 표본으로 잴 수 있다. 샌드박스에서는 해당 도메인이 막혀 러너 전용.
  compare-market:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'compare-market'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Compare market vs model
        run: npx tsx scripts/compare_market.ts
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seed/market_comparison.json || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "배당 vs 모델 비교 결과 갱신 (자동)"
            git push
          fi

  # 앱이 실제로 수집한 배당(D1 market_odds)으로 같은 비교를 돌린다. compare-market은
  # football-data 종가배당이라 서비스가 쓰는 값과 다르다 - marketWeight 조정 근거는 이쪽이다.
  compare-market-d1:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'compare-market-d1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Compare app odds vs model
        run: npx tsx scripts/compare_market_d1.ts
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seed/market_comparison_d1.json || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "앱 실제 배당 vs 모델 비교 결과 갱신 (자동)"
            git push
          fi

  # 북메이커별/시점별(개장가 vs 종가) 배당 품질 비교. "배당의 질을 어떻게 올릴지"의 근거.
  compare-bookmakers:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'compare-bookmakers'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Compare bookmakers
        run: npx tsx scripts/compare_bookmakers.ts
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seed/bookmaker_comparison.json || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "북메이커별 배당 품질 비교 결과 갱신 (자동)"
            git push
          fi

  # 정산된 회차의 사후 분석. 빗나간 경기를 원인별로 분류해 "왜 틀렸는가"를 남긴다.
  round-report:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'round-report'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Round post-mortem
        run: npx tsx scripts/round_report.ts ${{ inputs.round_no }}
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seed/round_report_*.json || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "회차 사후분석 리포트 갱신 (자동)"
            git push
          fi

  # 회차가 안 뜰 때 "발매 전"인지 "파서 파손"인지 가른다. 둘 다 masterSeq=null로 똑같이 보여서
  # 로그만으로는 구분이 안 된다 - 과거 회차를 대조군으로 함께 조회해 판정한다.
  diagnose-round:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'diagnose-round'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Diagnose round detection
        run: npx tsx scripts/diagnose_round.ts

  # 특정 회차의 대진/배당/팀명 매핑 상태를 있는 그대로 찍는다. 배당 기반 예측(B안)이
  # 그 회차에 성립하는지 판단하는 근거.
  probe-round:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'probe-round'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Probe round
        run: npx tsx scripts/probe_round.ts ${{ inputs.round_no || '47' }}

  sheets:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'sheets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install gspread oauth2client requests
      - name: Export 회차분석 sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/export_sheets.py
      - name: Export 팀 DB / 선수 DB sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/export_player_db.py

  # 종료된 회차 목록 HTML에 실제 스코어가 들어 있는지 확인한다.
  # UCL/UEL처럼 NAME_MAP·FotMob 백필이 없는 회차의 정산 경로를 정하기 위한 근거.
  probe-results:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'probe-results'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Probe results
        run: npx tsx scripts/probe_results.ts ${{ inputs.round_no || '46' }}

  # 야구토토 승1패를 붙일 가치가 있는지 실측으로 판단한다.
  # 승1패의 "1"은 점수차 구간이라 우리 승률 모델로는 계산되지 않는다 - 그 구간이 예측
  # 가능한지(전력차에 따라 움직이는지)부터 재본다.
  measure-baseball:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'measure-baseball'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Measure baseball
        run: npx tsx scripts/measure_baseball.ts

  # wisetoto가 야구토토에도 해외배당을 주는지 확인한다. 축구(sc1)와 카테고리 코드가 달라
  # 코드를 추측하지 않고 index.htm이 노출하는 카테고리부터 훑는다.
  probe-baseball-odds:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'probe-baseball-odds'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Probe baseball odds
        run: npx tsx scripts/probe_baseball_odds.ts

  measure-xg-europe:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'measure-xg-europe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Measure xG predictive power in European leagues
        run: npx tsx scripts/measure_xg_europe.ts

  probe-xg-sources:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'probe-xg-sources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Probe per-match xG data sources
        run: npx tsx scripts/probe_xg_sources.ts

  ablation:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'ablation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run A-F ablation ladder
        run: npx tsx scripts/ablation.ts

  measure-xg-variants:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'measure-xg-variants'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Compare xG variants
        run: npx tsx scripts/measure_xg_variants.ts

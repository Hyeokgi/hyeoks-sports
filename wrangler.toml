name = "kleague-toto-predictor"
main = "src/index.ts"
compatibility_date = "2025-07-01"

[assets]
directory = "./public"
binding = "ASSETS"
# 정적 index가 공개 SSR 홈·서버 canonical 처리를 우회하지 않게 한다.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "kleague-toto-db"
database_id = "3a5fc8d6-f831-4a4c-9e16-90223cc56467"

[[kv_namespaces]]
binding = "KV"
id = "4eddcce52bd645d3ac728fb93e3b4892"

[triggers]
# */10: 마감 12·6·3·1시간 전 배당·투표율 수집 호출(src/cron/deadlineTrigger.ts)
# 30 */6: 경기별 페이지용 경기 수집·예측(src/lib/fixtures.ts)
crons = ["0 */3 * * *", "0 */6 * * *", "30 */6 * * *", "*/10 * * * *"]

[vars]
ENVIRONMENT = "production"
